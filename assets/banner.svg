<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1145" />
    </linearGradient>

    <!-- Orb Gradients -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.85" />
    </linearGradient>

    <!-- Animated Pulse / Float Styles -->
    <style>
      .orb-1 {
        animation: floatOrb1 14s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb2 16s ease-in-out infinite alternate;
      }
      .pulse-line {
        stroke-dasharray: 8, 8;
        animation: dashMove 30s linear infinite;
      }
      .wave-dot {
        animation: pulseDot 3s ease-in-out infinite alternate;
      }
      .pill-hover {
        transition: transform 0.3s ease;
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(80px, 40px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-60px, -35px) scale(1.2); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes pulseDot {
        0% { opacity: 0.3; transform: scale(0.9); }
        100% { opacity: 0.9; transform: scale(1.2); }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.01em;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glow Orbs (Strictly in Background) -->
  <g opacity="0.8">
    <circle class="orb-1" cx="220" cy="110" r="240" fill="url(#glowCyan)" />
    <circle class="orb-2" cx="980" cy="290" r="270" fill="url(#glowPurple)" />
    <circle cx="600" cy="380" r="200" fill="url(#glowRose)" />
  </g>

  <!-- Technical Circuit Grid Lines (Background decoration) -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Dynamic Connection Paths & Data Waves (Layered Behind Text) -->
  <g opacity="0.35">
    <path class="pulse-line" d="M -50 310 Q 300 240 600 320 T 1250 250" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="pulse-line" d="M -50 340 Q 350 390 700 310 T 1250 330" fill="none" stroke="#a855f7" stroke-width="2" />
    <circle class="wave-dot" cx="280" cy="275" r="4" fill="#38bdf8" />
    <circle class="wave-dot" cx="620" cy="320" r="4.5" fill="#c084fc" />
    <circle class="wave-dot" cx="940" cy="285" r="4" fill="#f472b6" />
  </g>

  <!-- Foreground Content: Badge Pill -->
  <g transform="translate(600, 72)">
    <rect x="-165" y="-17" width="330" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="-142" cy="0" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-126" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="0.08em">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Main Title (Strictly Foreground with drop shadow) -->
  <g filter="drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6))">
    <text class="title-text" x="600" y="145" font-size="44" fill="url(#titleGrad)" text-anchor="middle">
      Email Marketing &amp; Automation
    </text>
  </g>

  <!-- Subtitle (Strictly Foreground) -->
  <text class="subtitle-text" x="600" y="195" font-size="17" fill="#94a3b8" text-anchor="middle">
    Top SaaS Platforms, High-Deliverability Senders &amp; Self-Hosted Open-Source Engines
  </text>

  <!-- Floating Feature Pills (Foreground Layer below subtitle) -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: SaaS Scale -->
    <g transform="translate(-460, 0)">
      <rect x="0" y="0" width="195" height="42" rx="21" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <text class="pill-text" x="97" y="26" text-anchor="middle">🚀 SaaS &amp; Cloud Giants</text>
    </g>

    <!-- Pill 2: Open Source -->
    <g transform="translate(-235, 0)">
      <rect x="0" y="0" width="205" height="42" rx="21" fill="url(#pillGrad1)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
      <text class="pill-text" x="102" y="26" text-anchor="middle">⚡ Self-Hosted Engines</text>
    </g>

    <!-- Pill 3: Visual Automations -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="205" height="42" rx="21" fill="url(#pillGrad1)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
      <text class="pill-text" x="102" y="26" text-anchor="middle">🔀 Visual Flow Journeys</text>
    </g>

    <!-- Pill 4: Privacy & GDPR -->
    <g transform="translate(235, 0)">
      <rect x="0" y="0" width="215" height="42" rx="21" fill="url(#pillGrad1)" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.6" />
      <text class="pill-text" x="107" y="26" text-anchor="middle">🛡️ Privacy &amp; Data Sovereignty</text>
    </g>
  </g>

  <!-- Bottom Accent Highlights -->
  <g opacity="0.7">
    <line x1="200" y1="360" x2="1000" y2="360" stroke="#334155" stroke-width="1" />
    <circle cx="600" cy="360" r="3" fill="#818cf8" />
  </g>
</svg>
